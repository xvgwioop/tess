<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Korawit | Minimal Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Quicksand', 'Kanit', sans-serif; 
        }

        body {
            background-color: #fcf8f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* ล็อกพื้นหลังให้คงที่ที่นี่ที่เดียว */
        #backgroundOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* รูปพื้นหลังตึก/หน้าต่างของคุณ */
            background: url('https://i.postimg.cc/3wjsKkCP/20250920-010358.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            /* ลบ transition background ออกเพื่อให้มันนิ่งที่สุด */
        }

        .top-image {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 120px;
            height: auto;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .top-image:hover { transform: scale(1.1) rotate(-5deg); }
        .top-image:active { transform: scale(0.9); }

        .center-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 500px;
            padding: 20px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .login-box {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 40px;
            text-align: center;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        h2 {
            color: #8e8279;
            margin-bottom: 25px;
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.4;
        }

        .input-box {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .input-box input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #eee;
            border-radius: 15px;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            color: #7a6d65;
        }

        .input-box input:focus {
            border-color: #ffb6c1;
            background: white;
        }

        .input-box label {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: #a3968e;
            pointer-events: none;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }

        .input-box input:focus + label,
        .input-box input:not(:placeholder-shown) + label {
            top: -10px;
            left: 15px;
            font-size: 0.8rem;
            color: #ff85c1;
            background: white;
            padding: 0 8px;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 15px;
            background-color: #e8d5cc;
            color: #8e8279;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #dfc7bc;
            transform: translateY(-3px);
        }

        #imageContainer {
            display: none;
            opacity: 0;
            transform: scale(0.95);
        }

        #imageContainer.show {
            display: flex;
            opacity: 1;
            transform: scale(1);
        }

        .image-container img {
            width: 100%;
            border-radius: 20px;
            margin-top: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        #errorBox {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 9999;
            width: 300px;
        }

        #errorBox.hidden { display: none; }

        #bottomRightBox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(232, 213, 204, 0.8);
            color: #8e8279;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
            z-index: 1000;
        }

        .hidden-bottom { display: none; }
    </style>
</head>
<body>

    <div id="backgroundOverlay"></div>
    
    <img src="https://i.postimg.cc/5yBD8bhw/1758548455711.png" class="top-image" id="backToLogin">

    <div class="center-container" id="loginContainer">
        <div class="login-box" id="loginForm">
            <h2>Welcome Back 🌸</h2>
            <div class="input-box">
                <input type="text" id="username" placeholder=" " required>
                <label>Username na hubb</label>
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder=" " required>
                <label>Password (dd,mm)</label>
            </div>
            <button type="button" onclick="login()">Login</button>
        </div>
    </div>

    <div class="center-container" id="imageContainer">
        <div class="login-box" id="imageBox">
            <h2 id="greetingText">Hi na hub you!! 🌸</h2>
            <div class="image-container">
                <img id="displayImage" src="" alt="Display">
            </div>
            <p id="footerText" style="margin-top: 20px; font-size: 0.9rem; color: #a3968e;"></p>
        </div>
    </div>

    <div id="bottomRightBox">
        <b>Demo Account:</b><br>
        User: korawit / Pass: 0301<br>
        ลองใส่ดูด้ายน้าาา👆🏻
    </div>

    <div id="errorBox" class="hidden">
        <p style="margin-bottom: 20px;">Username หรือ Password<br>ไม่ถูกต้องนะฮะ 🥺</p>
        <button onclick="closeError()" style="padding: 10px;">ตกลง</button>
    </div>

    <script>
    const users = [
        {
            username: 'korawit',
            password: '0301',
            image: 'https://i.postimg.cc/FHhLwWpG/how-You-20250914-233456-0000.png',
            greeting: 'Hi na hub you!! 🌸',
            footer: 'Have a wonderful day, Korawit ✨'
        },
        {
            username: 'kantamxs',
            password: '2606',
            image: 'https://i.postimg.cc/1tRJJw5X/20250915-031854-0000.png',
            greeting: 'Hi JuneNae~ Kantamxs! 🌸',
            footer: 'Stay cute as always! ✨'
        }
    ];

    function login() {
        const uInput = document.getElementById('username').value.trim();
        const pInput = document.getElementById('password').value.trim();
        const user = users.find(u => u.username.toLowerCase() === uInput.toLowerCase() && u.password === pInput);

        if (user) {
            const loginContainer = document.getElementById('loginContainer');
            const imageContainer = document.getElementById('imageContainer');
            
            // เลื่อนหน้าจอปกติ
            loginContainer.style.opacity = "0";
            loginContainer.style.transform = "scale(0.9)";

            setTimeout(() => {
                loginContainer.style.display = 'none';
                
                // เปลี่ยนแค่รูปและข้อความในกล่อง
                document.getElementById('displayImage').src = user.image;
                document.getElementById('greetingText').textContent = user.greeting;
                document.getElementById('footerText').textContent = user.footer;

                // แสดงหน้าผลลัพธ์
                imageContainer.style.display = 'flex';
                setTimeout(() => imageContainer.classList.add('show'), 50);
                document.getElementById('bottomRightBox').classList.add('hidden-bottom');
            }, 400);
        } else {
            document.getElementById('errorBox').classList.remove('hidden');
        }
    }

    function closeError() {
        document.getElementById('errorBox').classList.add('hidden');
    }

    document.getElementById('backToLogin').addEventListener('click', function() {
        const loginContainer = document.getElementById('loginContainer');
        const imageContainer = document.getElementById('imageContainer');

        imageContainer.classList.remove('show');
        setTimeout(() => {
            imageContainer.style.display = 'none';
            loginContainer.style.display = 'flex';
            setTimeout(() => {
                loginContainer.style.opacity = '1';
                loginContainer.style.transform = 'scale(1)';
            }, 50);
            document.getElementById('bottomRightBox').classList.remove('hidden-bottom');
        }, 300);
    });

    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') login();
        });
    });
    </script>
</body>
</html>
