<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HBD Suksan - Mobile Friendly</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&family=Kanit:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Quicksand', 'Kanit', sans-serif; /* เพิ่ม Font Kanit ให้รองรับภาษาไทยสวยๆ */
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #fcf8f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            color: #7a6d65;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .bg-circle {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(232,213,204,0.4) 0%, rgba(252,248,245,0) 70%);
            border-radius: 50%;
            z-index: -1;
            animation: move 20s infinite alternate;
            pointer-events: none;
        }

        @keyframes move {
            from { transform: translate(-50%, -50%); }
            to { transform: translate(50%, 50%); }
        }

        .card {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 50px;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            width: 100%;
            max-width: 850px; 
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        .btn-back {
            position: absolute;
            top: 25px;
            left: 25px;
            background: #f0e6e1;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            color: #8e8279;
            font-size: 1.2rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .btn-back:active { transform: scale(0.9); }

        #content-header {
            transition: all 0.5s ease;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            font-weight: 600;
            color: #8e8279;
            animation: fadeInDown 0.8s ease;
            line-height: 1.3;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 35px;
            color: #a3968e;
            animation: fadeInUp 0.8s ease;
        }

        .btn-view {
            background-color: #e8d5cc;
            color: #8e8279;
            border: none;
            padding: 16px 40px;
            border-radius: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            user-select: none; 
        }

        .btn-view::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: rotate(45deg);
            transition: 0.5s;
        }

        .btn-view:active { transform: scale(0.95); }

        /* --- 2 Columns Layout --- */
        .img-container {
            display: none;
            width: 100%;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .content-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            text-align: left;
        }

        .text-col { flex: 1; }
        .img-col { flex: 1; }

        .img-col img {
            width: 100%;
            border-radius: 25px;
            display: block;
            box-shadow: 0 15px 30px rgba(0,0,0,0.07);
        }

        .text-col h2 {
            font-size: 1.8rem;
            color: #8e8279;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .text-col p {
            font-size: 1.1rem; /* ปรับขนาดให้อ่านง่าย */
            color: #a3968e;
            margin-bottom: 0;
            line-height: 1.8; /* เพิ่มระยะห่างบรรทัด */
        }

        /* Helpers */
        .show-flex { display: flex !important; animation: fadeIn 0.5s forwards; }
        .show-block { display: block !important; opacity: 1; transform: translateY(0) scale(1); }
        .fade-out { opacity: 0; transform: translateY(-20px); pointer-events: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* =========================================
           MOBILE RESPONSIVE STYLES (ปรับปรุงใหม่)
           ========================================= */
        @media screen and (max-width: 768px) { 
            body { 
                padding: 15px; 
                align-items: flex-start; /* ให้เริ่มจากบนลงล่าง กันตกขอบถ้าจอยาว */
                overflow-y: auto; /* ให้เลื่อนแนวตั้งได้ */
            }

            .card {
                padding: 30px 20px; /* ลดขอบให้เนื้อหาเยอะขึ้น */
                border-radius: 30px;
                max-width: 100%;
                margin-top: 20px; /* ระยะห่างจากขอบบน */
                margin-bottom: 20px;
            }

            .content-row {
                /* column-reverse = เอารูป (div ล่าง) ขึ้นไปอยู่ข้างบน */
                flex-direction: column-reverse; 
                gap: 25px;
                text-align: center; /* จัดกลางให้อ่านง่ายในมือถือ */
            }

            .text-col {
                width: 100%;
            }

            .text-col h2 { 
                font-size: 1.6rem; 
                margin-bottom: 10px;
            }
            
            .text-col p { 
                font-size: 1rem; 
                text-align: center; /* จัดข้อความให้อยู่กึ่งกลาง */
            }

            .img-col {
                width: 100%;
                max-width: 300px; /* จำกัดขนาดรูปไม่ให้ใหญ่เต็มจอเกินไป */
                margin: 0 auto;
            }

            h1 { font-size: 1.8rem; margin-bottom: 10px; }
            
            .btn-view { width: 100%; }

            .bg-circle { width: 150px; height: 150px; }
            .btn-back { top: 15px; left: 15px; width: 35px; height: 35px; }
        }
    </style>
</head>
<body>

    <div class="bg-circle" style="top: 20%; left: 20%;"></div>
    <div class="bg-circle" style="bottom: 10%; right: 10%; animation-delay: -5s;"></div>

    <div class="card">
        <button class="btn-back" id="backBtn" onclick="closePhoto()">←</button>

        <div id="content-header">
            <h1>Suksan Wankerd hubb 🙌🏻</h1>
            <p>Click ดูได้น่ะฮับบ💕</p>
            <button class="btn-view" onclick="openPhoto()">Open Du si</button>
        </div>

        <div class="img-container" id="photoBox">
            <div class="content-row">
                
                <div class="text-col">
                    <h2>Thank you ✨</h2>
                    <p>
                        ขอบคุณที่เข้ามาดูกันน้าาา <br>
                        นี่ก็เกิดแล้วน่ะฮับบ 3 Jan <br>
                        มาพร้อมกับปีใหม่เลยน้าา :3 <br><br>
                        ยังไงก็ปีนี้ ขอให้เป็นปีที่ดี มีความสุขเย้อๆ<br>
                        ที่ผ่านมาอะไรหลายๆ อย่างก็สอนไว้เยอะเลยล่ะนะ<br>
                        ต่อจากนี้ก็จะยิ้มๆ เยอะๆ <br>
                        ค่อยๆ เป็นค่อยๆ ไปแล้วกันฮ่ะ
                    </p>
                </div>

                <div class="img-col">
                    <img src="https://i.postimg.cc/LsB5QgJZ/Screenshot-20251230-214305-Canva.jpg" alt="Mood Photo">
                </div>

            </div>
        </div>
    </div>

    <script>
        const header = document.getElementById('content-header');
        const photoBox = document.getElementById('photoBox');
        const backBtn = document.getElementById('backBtn');

        function openPhoto() {
            header.classList.add('fade-out');
            
            setTimeout(() => {
                header.style.display = 'none';
                photoBox.classList.add('show-block'); 
                backBtn.classList.add('show-flex');
            }, 500);
        }

        function closePhoto() {
            photoBox.classList.remove('show-block');
            backBtn.classList.remove('show-flex');
            
            setTimeout(() => {
                header.style.display = 'block';
                header.classList.remove('fade-out');
                
                header.style.animation = 'none';
                header.offsetHeight; 
                header.style.animation = null;
            }, 300);
        }
    </script>
</body>
</html>
